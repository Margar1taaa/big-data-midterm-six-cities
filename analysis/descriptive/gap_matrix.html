html+='<div style="display:flex;min-width:820px;">';
html+='<div style="width:128px;flex:0 0 128px;"></div>';

  var y=Y0+i;
  var show=(y===Y0||(y-Y0)%5===0);
  html+='<div style="width:'+CW+'px;flex:0 0 '+CW+'px;font-size:9.5px;color:#3d5468;text-align:center;'+(i===0?'border-left:2px solid #14263b;':'')+'">'+(show?y:'')+'</div>';
}
html+='</div>';
var order=["DIPHTHERIA","INFLUENZA","POLIOMYELITIS"];
order.forEach(function(dis){
  var rows=ROWS.filter(function(r){return r.d===dis;});
  if(!rows.length)return;
  html+='<div style="min-width:820px;background:#eef3f8;font-size:12px;font-weight:700;color:#1f5f8b;padding:3px 0 3px 8px;margin-top:4px;border-radius:3px;">'+DIS[dis]+'</div>';

    html+='<div style="display:flex;min-width:820px;">';

      var has=r.cells[i]===1;
      html+='<div title="'+Y0+i+'年：'+(has?'有数据':'缺失')+'" style="width:'+CW+'px;height:'+CW+'px;flex:0 0 '+CW+'px;box-sizing:border-box;border-right:1px solid #f6f8fb;background:'+(has?'#2e7d5b':'#c96a2b')+';'+(i===0?'border-left:2px solid #14263b;':'')+'"></div>';
